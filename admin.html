<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — BRILLIANT</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #f4f4f4; color: #0a0a0a; font-family: 'Inter', sans-serif; margin: 0; padding: 50px 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 36px; text-align: center; margin-top: 0; margin-bottom: 30px;}
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; color: #666; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: inherit; font-size: 15px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #0a0a0a; }
    button { width: 100%; padding: 15px; background: #0a0a0a; color: #fff; border: none; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; margin-top: 10px; }
    button:hover { background: #333; }
    #message { text-align: center; margin-top: 20px; font-size: 14px; }
    .link { display: block; text-align: center; margin-top: 30px; color: #0a0a0a; text-decoration: none; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #0a0a0a; width: fit-content; margin-inline: auto; padding-bottom: 2px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container" id="loading-panel"><h1>Проверка прав...</h1></div>

  <!-- ФОРМА ВХОДА (если разлогинен) -->
  <div class="container hidden" id="login-panel">
    <h1>Вход в админку</h1>
    <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="login-password" required></div>
    <button onclick="manualLogin()" id="login-btn">Войти</button>
    <div id="login-msg" style="text-align: center; margin-top: 15px; font-size: 14px; color: red;"></div>
    <a href="index.html" class="link">На главную</a>
  </div>

  <!-- АДМИНКА (если вошел) -->
  <div class="container hidden" id="admin-panel">
    <h1>Добавить товар</h1>
    <form id="product-form">
      <div class="form-group"><label>Название</label><input type="text" id="name" required></div>
      <div class="form-group"><label>Цена</label><input type="text" id="price" required></div>
      <div class="form-group"><label>Ссылка на фото</label><input type="url" id="image_url" required></div>
      <button type="submit" id="submit-btn">Добавить в коллекцию</button>
      <div id="message"></div>
    </form>
    <a href="index.html" class="link">Вернуться на сайт</a>
  </div>

  <script>
    const supabaseUrl = 'https://brilliant-proxy.ksy2003nova.workers.dev';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5a3hkeGhvZ25hd3Jkd3FjenpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNzEwNzYsImV4cCI6MjEwOTY0NzA3Nn0.h3Ifaev9gkT_4EpYILBQspLpcMM-J5hBAz1FhAgk734'; 
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      document.getElementById('loading-panel').classList.add('hidden');

      if (user && user.app_metadata?.role === 'admin') {
        document.getElementById('admin-panel').classList.remove('hidden');
      } else {
        document.getElementById('login-panel').classList.remove('hidden');
      }
    }
    checkAuth();

    async function manualLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const msg = document.getElementById('login-msg');
      const btn = document.getElementById('login-btn');

      btn.textContent = "Загрузка...";
      msg.textContent = "";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        msg.textContent = "Ошибка: " + error.message;
        btn.textContent = "Войти";
      } else if (data.user.app_metadata?.role !== 'admin') {
        msg.textContent = "Вы не администратор!";
        btn.textContent = "Войти";
      } else {
        document.getElementById('login-panel').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
      }
    }

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');
      btn.textContent = 'Загрузка...';
      msg.textContent = '';

      const { error } = await supabaseClient.from('products').insert([{ 
        name: document.getElementById('name').value, 
        price: document.getElementById('price').value, 
        image_url: document.getElementById('image_url').value 
      }]);

      if (error) {
        msg.textContent = 'Ошибка: ' + error.message;
        msg.style.color = 'red';
      } else {
        msg.textContent = 'Товар успешно добавлен!';
        msg.style.color = 'green';
        document.getElementById('product-form').reset();
      }
      btn.textContent = 'Добавить в коллекцию';
    });
  </script>
</body>
</html>
